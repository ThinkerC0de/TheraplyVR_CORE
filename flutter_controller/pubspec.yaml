name: flutter_controller
description: Theraply VR Controller App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - UPDATED TO LATEST
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.3.7
  
  # UI
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # WebRTC (video stream from Quest) - 1.x for current Flutter embedding
  flutter_webrtc: ^1.3.0

  # Keep screen awake during active control session
  wakelock_plus: ^1.2.8

  # Send incident reports via default email app
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
