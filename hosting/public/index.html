<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theraply VR Framework</title>
  <style>
    :root {
      --bg-start: #f2f6ff;
      --bg-end: #f7fbf5;
      --card: #ffffff;
      --text: #122032;
      --muted: #5a6b80;
      --cta: #0f62fe;
      --cta-hover: #0043ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(18, 32, 50, 0.12);
      padding: 28px;
      display: grid;
      gap: 14px;
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.3;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .button {
      border: 0;
      border-radius: 10px;
      background: var(--cta);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 18px;
      transition: background 0.2s ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--cta-hover);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Theraply VR Framework</h1>
    <p>
      This hosting root provides access to operations tooling and deployment
      surfaces for the framework.
    </p>
    <div class="actions">
      <a class="button" href="/admin/">Open Admin Console</a>
    </div>
  </main>
</body>
</html>
